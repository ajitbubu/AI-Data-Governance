global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'datasafeguard-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'datasafeguard-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
